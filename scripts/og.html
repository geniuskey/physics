<!doctype html>
<html lang="ko" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <!-- 링크 미리보기 이미지(1200×630)를 그리는 페이지. scripts/og.sh 가 실험마다 찍어 public/og/<id>.jpg 로 저장해요 -->
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@500;600&display=swap" />
    <style>
      html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; background: #0b0c0e; }
      .og { position: relative; width: 1200px; height: 630px; font-family: Pretendard, system-ui, sans-serif; color: #ece6da; }
      canvas { position: absolute; top: 0; right: 0; }
      .shade { position: absolute; inset: 0; background: linear-gradient(90deg, #0b0c0e 0%, #0b0c0e 31%, rgba(11,12,14,.6) 42%, rgba(11,12,14,0) 56%); }
      .text { position: absolute; left: 64px; top: 0; bottom: 0; width: 560px; display: flex; flex-direction: column; justify-content: center; }
      .brand { display: flex; align-items: center; gap: 12px; font-size: 24px; color: #c8a96a; font-weight: 600; letter-spacing: .02em; position: absolute; top: 56px; }
      .cat { font-size: 22px; color: var(--c); font-weight: 600; margin-bottom: 14px; }
      h1 { font-family: 'Noto Serif KR', serif; font-weight: 600; font-size: 62px; line-height: 1.22; margin: 0 0 22px; color: #fbf6ec; word-break: keep-all; }
      h1.long { font-size: 52px; }
      p { font-size: 25px; line-height: 1.55; margin: 0; color: #bdb5a6; word-break: keep-all; }
      .rule { position: absolute; left: 0; right: 0; bottom: 0; height: 6px; background: linear-gradient(90deg, #9c7f45, #e2c88f, #9c7f45); }
    </style>
  </head>
  <body>
    <div class="og">
      <canvas width="820" height="630"></canvas>
      <div class="shade"></div>
      <div class="text">
        <div class="brand"></div>
        <div class="cat"></div>
        <h1></h1>
        <p></p>
      </div>
      <div class="rule"></div>
    </div>
    <script type="module" src="./og.ts"></script>
  </body>
</html>
